# Builds the ZIP the Omeka addon registry expects: one top-level directory
# named after the plugin, not the repository.
name: Release
on:
  release:
    types: [published]

jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: git archive --prefix=ZoteroDcImport/ -o ZoteroDcImport.zip HEAD
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ZoteroDcImport.zip
